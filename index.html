<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💖 Style Remover 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Cute Color Palette */
        --bg-light: #fff0f5; /* Lavender Blush */
        --bg-container: #ffffff;
        --text-dark: #4b0082; /* Indigo */
        --text-light: #6a5acd; /* Slate Blue */
        --primary: #da70d6; /* Orchid */
        --primary-dark: #ba55d3; /* Medium Orchid */
        --secondary: #ffb6c1; /* Light Pink */
        --border-color: #e6e6fa; /* Lavender */
        --success: #3cb371; /* Medium Sea Green */
        --error: #dc143c; /* Crimson */
        --focus-ring: #4b0082; /* Indigo for focus */

        /* Fonts */
        --font-family: "Nunito", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        margin: 0;
        padding: 0;
        font-size: 100%; /* 16px base typically */
      }

      body {
        font-family: var(--font-family);
        line-height: 1.6;
        background-color: var(--bg-light);
        color: var(--text-light);
        display: flex;
        justify-content: center;
        align-items: flex-start; /* Align to top */
        min-height: 100vh;
        padding: 2rem 1rem; /* Add padding around */

        /* Main Container */
        & > .container {
          background-color: var(--bg-container);
          padding: 2rem;
          border-radius: 15px; /* Rounded corners */
          box-shadow: 0 4px 15px rgba(106, 90, 205, 0.1); /* Subtle shadow */
          max-width: 600px;
          width: 100%;
          text-align: center; /* Center text inside container */

          /* Headings and Paragraphs */
          & > h2 {
            color: var(--text-dark);
            margin-bottom: 0.75rem;
            font-size: 1.75rem; /* Larger heading */
          }

          & > p {
            margin-bottom: 1.5rem;
            font-size: 1rem;
            color: var(--text-light);
            text-wrap: pretty;
          }
        }
      }

      /* Editor Styling */
      #editor {
        background-color: #fff; /* White background */
        border: 2px solid var(--border-color);
        border-radius: 8px; /* Slightly less rounded than container */
        min-height: 200px; /* Increased height */
        padding: 15px;
        font-family: var(--font-family); /* Consistent font */
        font-size: 1rem;
        line-height: 1.5;
        margin-bottom: 1.5rem; /* More space below editor */
        text-align: left; /* Align text inside editor to left */
        color: var(--text-dark); /* Darker text for readability */
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        width: 100%; /* Ensure it takes full width of container */
      }

      /* Editor Focus State - Accessibility */
      #editor:focus {
        outline: none; /* Remove default outline */
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(218, 112, 214, 0.3); /* Soft focus ring */
      }

      /* Button Styling */
      #copyButton {
        background-color: var(--primary);
        color: var(--bg-container);
        border: none;
        padding: 12px 25px; /* Generous padding */
        border-radius: 25px; /* Pill shape */
        font-family: var(--font-family);
        font-size: 1rem;
        font-weight: 700; /* Bold text */
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.1s ease;
        display: inline-block; /* Allow margin auto if needed */
        margin-right: 10px; /* Space between button and feedback */
      }

      #copyButton:hover {
        background-color: var(--primary-dark);
      }

      #copyButton:active {
        transform: scale(0.98); /* Subtle press effect */
      }

      /* Button Focus State - Accessibility */
      #copyButton:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
      }

      /* Disabled Button State */
      #copyButton:disabled {
        background-color: var(--secondary);
        cursor: not-allowed;
        opacity: 0.7;
      }

      /* Feedback Area Styling */
      #copyFeedback {
        display: inline-block; /* Align with button */
        vertical-align: middle; /* Align text vertically */
        font-size: 0.95em;
        font-weight: 700;
        height: 1.5em; /* Ensure space is reserved */
        font-style: normal; /* Remove default italic */
        transition: color 0.3s ease;
      }

      /* Specific feedback colors (ensure good contrast) */
      #copyFeedback.success {
        color: var(--success);
      }

      #copyFeedback.error {
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <!-- Container for centering and styling -->
    <div class="container">
      <h2>Paste Your Text Here! ✨</h2>
      <p>Any pesky style attributes will magically disappear after pasting.</p>

      <!-- The actual editor -->
      <div
        id="editor"
        contenteditable="true"
        role="textbox"
        aria-multiline="true"
        aria-label="Text editor area"
      ></div>

      <!-- Controls -->
      <div>
        <button id="copyButton">Copy Clean Text</button>
        <span id="copyFeedback" aria-live="polite"></span>
        <!-- aria-live makes screen readers announce changes -->
      </div>
    </div>

    <script>
      const editor = document.getElementById("editor");
      const copyButton = document.getElementById("copyButton");
      const copyFeedback = document.getElementById("copyFeedback"); // Ensure this is defined

      // Helper function for feedback (or use the one in HTML)
      function showFeedback(message, type = "success") {
        if (copyFeedback) {
          copyFeedback.textContent = message;
          copyFeedback.className = type; // Set class 'success' or 'error'
          setTimeout(() => {
            copyFeedback.textContent = "";
            copyFeedback.className = "";
          }, 3000);
        }
      }

      // --- Function to clean HTML string ---
      // This function takes HTML, parses it, cleans it, and returns clean HTML
      function getCleanedHtml(sourceElement) {
        // Create a temporary, disconnected div element
        const tempDiv = document.createElement("div");
        // Populate it with the source element's content
        tempDiv.innerHTML = sourceElement.innerHTML;

        // --- Perform cleaning operations on the temporary div ---

        // 1. Remove inline style attributes
        const styledElements = tempDiv.querySelectorAll("[style]");
        styledElements.forEach((el) => el.removeAttribute("style"));
        console.log(`Cleaned ${styledElements.length} inline styles pre-copy.`);

        // 2. Remove class attributes (often carry unwanted styles)
        const classedElements = tempDiv.querySelectorAll("[class]");
        classedElements.forEach((el) => el.removeAttribute("class"));
        console.log(
          `Cleaned ${classedElements.length} class attributes pre-copy.`
        );

        // 3. Unwrap <code> tags
        const codeTags = tempDiv.querySelectorAll("code");
        codeTags.forEach((codeElement) => {
          const parent = codeElement.parentNode;
          if (parent) {
            while (codeElement.firstChild) {
              parent.insertBefore(codeElement.firstChild, codeElement);
            }
            codeElement.remove(); // Remove the empty <code>
          }
        });
        console.log(`Unwrapped ${codeTags.length} code tags pre-copy.`);

        // 4. Unwrap simple <span> tags (that don't contain block elements)
        // This helps remove spans used purely for styling. Be careful if spans
        // are used structurally in your expected content.
        const spanTags = tempDiv.querySelectorAll("span");
        spanTags.forEach((spanElement) => {
          // Basic check: If a span contains block elements, maybe keep it?
          // This check is simple; adjust if needed.
          const containsBlockElement = spanElement.querySelector(
            "p, div, h1, h2, h3, h4, h5, h6, ul, ol, li, blockquote, hr, table"
          );

          if (!containsBlockElement && spanElement.parentNode) {
            const parent = spanElement.parentNode;
            while (spanElement.firstChild) {
              parent.insertBefore(spanElement.firstChild, spanElement);
            }
            spanElement.remove(); // Remove the empty <span>
          }
        });
        console.log(
          `Attempted to unwrap ${spanTags.length} span tags pre-copy.`
        );

        // Return the innerHTML of the cleaned temporary div
        return tempDiv.innerHTML;
      }

      // --- Paste Cleaning Logic (remains the same - cleans the live editor) ---
      if (editor) {
        editor.addEventListener("paste", (event) => {
          console.log("Paste event detected!");
          setTimeout(() => {
            console.log("--- Cleaning editor post-paste ---");
            // Step 1: Remove inline styles
            const styledElements = editor.querySelectorAll("[style]");
            styledElements.forEach((el) => el.removeAttribute("style"));
            console.log(`Removed ${styledElements.length} inline styles.`);

            // Step 2: Remove class attributes
            const classedElements = editor.querySelectorAll("[class]");
            classedElements.forEach((el) => el.removeAttribute("class"));
            console.log(`Removed ${classedElements.length} class attributes.`);

            // Step 3: Unwrap <code> tags
            const codeTags = editor.querySelectorAll("code");
            codeTags.forEach((codeElement) => {
              const parent = codeElement.parentNode;
              if (parent) {
                while (codeElement.firstChild) {
                  parent.insertBefore(codeElement.firstChild, codeElement);
                }
                codeElement.remove();
              }
            });
            console.log(`Unwrapped ${codeTags.length} code tags.`);

            // Step 4: Unwrap simple <span> tags
            const spanTags = editor.querySelectorAll("span");
            spanTags.forEach((spanElement) => {
              const containsBlockElement = spanElement.querySelector(
                "p, div, h1, h2, h3, h4, h5, h6, ul, ol, li, blockquote, hr, table"
              );
              if (!containsBlockElement && spanElement.parentNode) {
                const parent = spanElement.parentNode;
                while (spanElement.firstChild) {
                  parent.insertBefore(spanElement.firstChild, spanElement);
                }
                spanElement.remove();
              }
            });
            console.log(`Attempted to unwrap ${spanTags.length} span tags.`);
            console.log("--- Editor cleaning finished ---");
          }, 0);
        });
      } else {
        console.error("Editor element not found!");
      }

      // --- Copy Button Logic (Uses the cleaning function) ---
      if (copyButton && editor && copyFeedback) {
        copyButton.addEventListener("click", async () => {
          // **Get the definitively cleaned HTML string**
          const cleanedHtmlContent = getCleanedHtml(editor);

          // Get plain text version as fallback (from the live editor is fine)
          const textContent = editor.innerText;

          // Clear previous feedback and disable button temporarily
          showFeedback("", ""); // Clear feedback
          copyButton.disabled = true;
          copyButton.textContent = "Copying...";

          if (!navigator.clipboard || !navigator.clipboard.write) {
            showFeedback("Clipboard API not supported.", "error");
            console.error("Clipboard API (write) not available.");
            copyButton.disabled = false;
            copyButton.textContent = "Copy Clean HTML";
            return;
          }

          try {
            // Use the CLEANED HTML for the blob
            const htmlBlob = new Blob([cleanedHtmlContent], {
              type: "text/html",
            });
            const textBlob = new Blob([textContent], { type: "text/plain" });

            const clipboardItem = new ClipboardItem({
              "text/html": htmlBlob,
              "text/plain": textBlob,
            });

            await navigator.clipboard.write([clipboardItem]);
            console.log("Cleaned HTML content copied to clipboard.");
            console.log("Copied HTML:", cleanedHtmlContent); // Log the actual copied HTML
            showFeedback("Copied!", "success");
          } catch (err) {
            console.error("Failed to copy cleaned HTML content: ", err);
            let errorMsg = "Failed to copy.";
            if (err.name === "NotAllowedError") {
              errorMsg = "Clipboard permission denied.";
            } else if (
              typeof ClipboardItem === "undefined" ||
              !navigator.clipboard.write
            ) {
              errorMsg = "Clipboard API not fully supported.";
            }
            showFeedback(errorMsg, "error");
          } finally {
            copyButton.disabled = false;
            copyButton.textContent = "Copy Clean HTML";
          }
        });
      } else {
        console.error(
          "Could not find editor, copy button, or feedback element."
        );
      }
    </script>
  </body>
</html>
